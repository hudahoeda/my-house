name: Validate house model

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate declarative model
        run: python scripts/validate_house.py house.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
